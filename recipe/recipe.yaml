context:
  version: 5.9.0

package:
  name: flask-security-too
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/flask-security-too/flask_security_too-${{ version }}.tar.gz
  sha256: 116db335c35e46c60db3cb7efbf507ee13b24a70076ba095b3c1e2fc6945e92b
  patches:
    - rename-pyproject-toml.patch

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - flit-core >=3.8,<4
  run:
    - python >=${{ python_min }}
    - flask >=3.1.1
    - flask-login >=0.6.3
    - flask-principal >=0.4.0
    - flask-wtf >=1.1.2
    - email-validator >=2.3.0
    - markupsafe >=2.1.0
    - libpass >=1.9.3
    - wtforms >=3.2.1
tests:
  - python:
      imports:
        - flask_security
        - flask_security.models
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Simple security for Flask apps.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/pallets-eco/flask-security
  documentation: https://flask-security.readthedocs.io/

extra:
  recipe-maintainers:
    - synapticarbors
